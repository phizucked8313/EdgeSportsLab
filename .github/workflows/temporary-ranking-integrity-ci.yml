name: Temporary Ranking Integrity CI

on:
  push:
    branches:
      - audit-and-sortable-board
  pull_request:
    branches:
      - live-war-room-core

permissions:
  contents: write

jobs:
  apply-injury-freshness-fix:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit-and-sortable-board
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Apply minimum injury freshness implementation
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("fantasy_draft_model/integrations/current_injury_normalizer.py")
          text = path.read_text(encoding="utf-8")

          old = '''    df["injury_source_timestamp"] = df["injury_source_timestamp"].apply(
              _clean
          )
          df.loc[
              df["injury_source_timestamp"] == "",
              "injury_source_timestamp",
          ] = now_iso
          '''
          new = '''    df["injury_source_timestamp"] = df["injury_source_timestamp"].apply(
              _clean
          )
          df["injury_freshness_known"] = df["injury_source_timestamp"].ne("")
          '''
          if old in text:
              text = text.replace(old, new, 1)
          elif 'df["injury_freshness_known"]' not in text:
              raise SystemExit("source timestamp block not found")

          old_return = '''            "injury_source", "injury_source_timestamp",
              "injury_age_hours", "injury_is_stale",
          '''
          new_return = '''            "injury_source", "injury_source_timestamp",
              "injury_age_hours", "injury_is_stale", "injury_freshness_known",
          '''
          if old_return in text:
              text = text.replace(old_return, new_return, 1)

          old_default = '''        "current_injury_is_stale": False,
              "current_injury_source_quality": "",
          '''
          new_default = '''        "current_injury_is_stale": False,
              "current_injury_freshness_known": False,
              "current_injury_source_quality": "",
          '''
          if old_default in text:
              text = text.replace(old_default, new_default, 1)

          old_columns = '''        "injury_is_stale",
              "injury_source_quality",
          '''
          new_columns = '''        "injury_is_stale",
              "injury_freshness_known",
              "injury_source_quality",
          '''
          if old_columns in text:
              text = text.replace(old_columns, new_columns, 1)

          old_record = '''            "current_injury_is_stale": _bool_value(
                  injury["injury_is_stale"]
              ),
              "current_injury_source_quality": _clean(
          '''
          new_record = '''            "current_injury_is_stale": _bool_value(
                  injury["injury_is_stale"]
              ),
              "current_injury_freshness_known": _bool_value(
                  injury["injury_freshness_known"]
              ),
              "current_injury_source_quality": _clean(
          '''
          if old_record in text:
              text = text.replace(old_record, new_record, 1)

          old_bool = '''        "current_injury_is_stale",
              "current_injury_research_override",
          '''
          new_bool = '''        "current_injury_is_stale",
              "current_injury_freshness_known",
              "current_injury_research_override",
          '''
          if old_bool in text:
              text = text.replace(old_bool, new_bool, 1)

          path.write_text(text, encoding="utf-8")
          PY
      - name: Verify injury freshness regression
        run: python -m pytest tests/test_current_injury_normalizer.py tests/test_current_injury_pipeline.py tests/test_current_injury_severity_contract.py -q
      - name: Commit injury freshness fix
        run: |
          if git diff --quiet; then
            echo "No production patch needed"
            exit 0
          fi
          git config user.name "EdgeIQ Ranking CI"
          git config user.email "actions@users.noreply.github.com"
          git add fantasy_draft_model/integrations/current_injury_normalizer.py
          git commit -m "fix: preserve injury source freshness provenance"
          git push origin HEAD:audit-and-sortable-board

  injury-freshness-contract:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Verify injury freshness provenance
        run: python -m pytest tests/test_current_injury_normalizer.py tests/test_current_injury_pipeline.py tests/test_current_injury_severity_contract.py -q
