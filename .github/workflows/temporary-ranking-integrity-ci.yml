name: Temporary Ranking Integrity CI

on:
  push:
    branches:
      - audit-and-sortable-board
  pull_request:
    branches:
      - live-war-room-core

permissions:
  contents: write

jobs:
  apply-injury-override-integration:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit-and-sortable-board
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Apply verified injury override integration
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("fantasy_draft_model/engines/projection_engine.py")
          text = path.read_text(encoding="utf-8")

          import_anchor = '''from fantasy_draft_model.integrations.current_injury_normalizer import (
              load_normalized_current_injuries,
              attach_current_injury_state,
          )
          '''
          import_add = import_anchor + '''from fantasy_draft_model.integrations.current_injury_overrides import (
              attach_current_injury_overrides,
          )
          '''
          if "from fantasy_draft_model.integrations.current_injury_overrides import" not in text:
              if import_anchor not in text:
                  raise SystemExit("current injury import anchor not found")
              text = text.replace(import_anchor, import_add, 1)

          flow_anchor = '''    current_injuries = load_normalized_current_injuries()
              df = attach_current_injury_state(df, current_injuries)
              current_injuries = add_team_injury_impact(current_injuries)
          '''
          flow_add = '''    current_injuries = load_normalized_current_injuries()
              df = attach_current_injury_state(df, current_injuries)
              df = attach_current_injury_overrides(df)
              current_injuries = add_team_injury_impact(current_injuries)
          '''
          if "df = attach_current_injury_overrides(df)" not in text:
              if flow_anchor not in text:
                  raise SystemExit("current injury projection flow anchor not found")
              text = text.replace(flow_anchor, flow_add, 1)

          path.write_text(text, encoding="utf-8")
          PY
      - name: Verify injury contracts
        run: python -m pytest tests/test_current_injury_normalizer.py tests/test_current_injury_pipeline.py tests/test_current_injury_severity_contract.py tests/test_current_injury_timeline_penalty.py tests/test_current_injury_projection_penalty.py tests/test_current_injury_overrides.py -q
      - name: Commit verified injury override integration
        run: |
          if git diff --quiet; then
            echo "No production patch needed"
            exit 0
          fi
          git config user.name "EdgeIQ Ranking CI"
          git config user.email "actions@users.noreply.github.com"
          git add fantasy_draft_model/engines/projection_engine.py
          git commit -m "feat: integrate verified injury timeline overrides"
          git push origin HEAD:audit-and-sortable-board

  ranking-integrity-contracts:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Verify injury contracts
        run: python -m pytest tests/test_current_injury_normalizer.py tests/test_current_injury_pipeline.py tests/test_current_injury_severity_contract.py tests/test_current_injury_timeline_penalty.py tests/test_current_injury_projection_penalty.py tests/test_current_injury_overrides.py -q
