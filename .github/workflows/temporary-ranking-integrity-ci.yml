name: Temporary Ranking Integrity CI

on:
  push:
    branches:
      - audit-and-sortable-board
  pull_request:
    branches:
      - live-war-room-core

permissions:
  contents: write

jobs:
  apply-injury-override-integration:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit-and-sortable-board
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Apply verified injury override integration
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("fantasy_draft_model/engines/projection_engine.py")
          text = path.read_text(encoding="utf-8")

          import_anchor = '''from fantasy_draft_model.integrations.current_injury_normalizer import (
              load_normalized_current_injuries,
              attach_current_injury_state,
          )
          '''
          import_add = import_anchor + '''from fantasy_draft_model.integrations.current_injury_overrides import (
              attach_current_injury_overrides,
          )
          '''
          if "from fantasy_draft_model.integrations.current_injury_overrides import" not in text:
              if import_anchor not in text:
                  raise SystemExit("current injury import anchor not found")
              text = text.replace(import_anchor, import_add, 1)

          flow_anchor = '''    current_injuries = load_normalized_current_injuries()
              df = attach_current_injury_state(df, current_injuries)
              current_injuries = add_team_injury_impact(current_injuries)
          '''
          flow_add = '''    current_injuries = load_normalized_current_injuries()
              df = attach_current_injury_state(df, current_injuries)
              df = attach_current_injury_overrides(df)
              current_injuries = add_team_injury_impact(current_injuries)
          '''
          if "df = attach_current_injury_overrides(df)" not in text:
              if flow_anchor not in text:
                  raise SystemExit("current injury projection flow anchor not found")
              text = text.replace(flow_anchor, flow_add, 1)

          path.write_text(text, encoding="utf-8")
          PY
      - name: Verify injury contracts
        run: python -m pytest tests/test_current_injury_normalizer.py tests/test_current_injury_pipeline.py tests/test_current_injury_severity_contract.py tests/test_current_injury_timeline_penalty.py tests/test_current_injury_projection_penalty.py tests/test_current_injury_overrides.py -q
      - name: Commit verified injury override integration
        run: |
          if git diff --quiet; then
            echo "No production patch needed"
            exit 0
          fi
          git config user.name "EdgeIQ Ranking CI"
          git config user.email "actions@users.noreply.github.com"
          git add fantasy_draft_model/engines/projection_engine.py
          git commit -m "feat: integrate verified injury timeline overrides"
          git push origin HEAD:audit-and-sortable-board

  apply-position-demand-scarcity-audit:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit-and-sortable-board
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Apply minimum demand-scarcity diagnostic
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("fantasy_draft_model/audit_war_room_rankings.py")
          text = path.read_text(encoding="utf-8")
          marker = "\ndef build_te_ranking_audit(board):\n"
          function = '''

def build_position_demand_scarcity_audit(board, replacement_ranks, top_n=12):
    """Compare top-board scarcity awards with league lineup demand by position."""
    positions = ("QB", "RB", "WR", "TE")
    if "position" not in board.columns:
        return pd.DataFrame()

    top_n = max(1, int(top_n))
    if "brain_score" in board.columns:
        top_board = board.sort_values("brain_score", ascending=False).head(top_n).copy()
    elif "draft_rank" in board.columns:
        top_board = board.sort_values("draft_rank", ascending=True).head(top_n).copy()
    else:
        top_board = board.head(top_n).copy()

    top_board = _add_multipath_value_columns(top_board)
    total_top = len(top_board)
    demand = {
        position: max(0, int(replacement_ranks.get(position, 0)))
        for position in positions
    }
    total_demand = sum(demand.values())

    rows = []
    for position in positions:
        position_rows = top_board.loc[
            top_board["position"].astype(str).str.strip().str.upper() == position
        ]
        replacement_rank = demand[position]
        top_n_players = len(position_rows)
        demand_share = replacement_rank / total_demand if total_demand else 0.0
        top_n_share = top_n_players / total_top if total_top else 0.0
        ratio = top_n_share / demand_share if demand_share else 0.0
        scarcity_points = float(position_rows["brain_scarcity_total"].sum())
        points_per_slot = scarcity_points / replacement_rank if replacement_rank else 0.0

        rows.append(
            {
                "position": position,
                "replacement_rank": replacement_rank,
                "top_n_players": top_n_players,
                "demand_share": demand_share,
                "top_n_share": top_n_share,
                "top_n_vs_demand_ratio": ratio,
                "top_n_brain_scarcity_points": round(scarcity_points, 2),
                "scarcity_points_per_demand_slot": round(points_per_slot, 3),
            }
        )

    return pd.DataFrame(rows)
'''

          if "def build_position_demand_scarcity_audit(" not in text:
              if marker not in text:
                  raise SystemExit("audit insertion marker not found")
              text = text.replace(marker, function + marker, 1)

          path.write_text(text, encoding="utf-8")
          PY
      - name: Verify demand-scarcity diagnostic
        run: python -m pytest tests/test_position_demand_scarcity_audit.py -q
      - name: Commit demand-scarcity diagnostic
        run: |
          if git diff --quiet; then
            echo "No diagnostic patch needed"
            exit 0
          fi
          git config user.name "EdgeIQ Ranking CI"
          git config user.email "actions@users.noreply.github.com"
          git add fantasy_draft_model/audit_war_room_rankings.py
          git commit -m "feat: add position demand scarcity diagnostic"
          git push origin HEAD:audit-and-sortable-board

  ranking-integrity-contracts:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Verify injury contracts
        run: python -m pytest tests/test_current_injury_normalizer.py tests/test_current_injury_pipeline.py tests/test_current_injury_severity_contract.py tests/test_current_injury_timeline_penalty.py tests/test_current_injury_projection_penalty.py tests/test_current_injury_overrides.py -q
      - name: Verify position demand scarcity audit
        run: python -m pytest tests/test_position_demand_scarcity_audit.py -q
