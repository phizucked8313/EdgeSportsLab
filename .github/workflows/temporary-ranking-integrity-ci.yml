name: Temporary Ranking Integrity CI

on:
  push:
    branches:
      - audit-and-sortable-board
  pull_request:
    branches:
      - live-war-room-core

jobs:
  injury-freshness-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Verify injury freshness provenance
        run: python -m pytest tests/test_current_injury_normalizer.py -q
