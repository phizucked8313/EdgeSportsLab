name: Temporary Audit CI

on:
  push:
    branches:
      - audit-and-sortable-board

jobs:
  targeted-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run sortable-board regression
        run: python -m pytest tests/test_war_room_draft_night_display.py -q
