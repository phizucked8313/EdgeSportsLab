name: Frozen War Room CI

on:
  push:
    branches:
      - codex/frozen-war-room-startup
  workflow_dispatch:

jobs:
  targeted:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt
      - name: Run frozen War Room targeted tests
        run: python -m pytest -q tests/test_frozen_war_room_startup.py
