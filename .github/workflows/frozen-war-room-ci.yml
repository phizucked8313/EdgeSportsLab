name: Frozen War Room CI

on:
  pull_request:
    branches:
      - live-war-room-core
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt
      - name: Diagnose frozen snapshot hashes
        run: |
          python - <<'PY'
          from hashlib import sha256
          from pathlib import Path
          path = Path('fantasy_draft_model/data/frozen/2026/edgeiq-top-300-2026.csv')
          raw = path.read_bytes()
          lf = raw.replace(b'\r\n', b'\n')
          crlf = lf.replace(b'\n', b'\r\n')
          print('raw_sha256=', sha256(raw).hexdigest())
          print('lf_sha256=', sha256(lf).hexdigest())
          print('crlf_sha256=', sha256(crlf).hexdigest())
          print('raw_crlf_count=', raw.count(b'\r\n'))
          print('raw_lf_count=', raw.count(b'\n'))
          PY
      - name: Run frozen War Room targeted tests
        run: >-
          python -m pytest -q
          tests/test_frozen_war_room_startup.py
          tests/test_frozen_war_room_full_draft.py
          tests/test_draft_night_runbook.py
      - name: Run full suite
        run: python -m pytest -q
