name: Frozen War Room CI

on:
  pull_request:
    branches:
      - live-war-room-core
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
      - name: Install dependencies
        run: >-
          python -m pip install --upgrade pip &&
          python -m pip install -r requirements.txt &&
          python -m pip install openpyxl
      - name: Run frozen War Room targeted tests
        run: >-
          python -m pytest -q
          tests/test_frozen_war_room_startup.py
          tests/test_frozen_war_room_full_draft.py
          tests/test_draft_night_runbook.py
      - name: Run full suite
        run: python -m pytest -q
