name: Temporary RC Ranking Verification

on:
  push:
    branches:
      - draft-night-ranking-rc
  workflow_dispatch:

jobs:
  targeted:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Verify keeper-aware scarcity
        run: python -m pytest tests/test_keeper_aware_available_pool_scarcity.py -q
