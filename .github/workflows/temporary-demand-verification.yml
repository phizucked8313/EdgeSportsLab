name: Temporary Demand Verification

on:
  push:
    branches:
      - audit-and-sortable-board
  pull_request:
    branches:
      - live-war-room-core

permissions:
  contents: write

jobs:
  apply-historical-baseline-green:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit-and-sortable-board
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt openpyxl
      - name: Apply minimum historical multiplier consumption
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("fantasy_draft_model/engines/projection_engine.py")
          text = path.read_text(encoding="utf-8")
          old = '''    df["baseline_projection"] = (
        df["custom_points_per_game"] * PROJECTED_GAMES
    )
'''
          new = '''    historical_multiplier = pd.to_numeric(
        df.get(
            "historical_regression_multiplier",
            pd.Series(1.0, index=df.index),
        ),
        errors="coerce",
    ).fillna(1.0)

    df["baseline_projection"] = (
        df["custom_points_per_game"]
        * PROJECTED_GAMES
        * historical_multiplier
    )
'''
          if old in text:
              text = text.replace(old, new, 1)
              path.write_text(text, encoding="utf-8")
          elif "historical_regression_multiplier" not in text:
              raise SystemExit("calculate_projection baseline anchor not found")
          PY
      - name: Verify historical regression target
        run: python -m pytest tests/test_historical_baseline_regression.py -q
      - name: Verify full suite before commit
        run: python -m pytest -q
      - name: Commit production change only after GREEN
        run: |
          if git diff --quiet -- fantasy_draft_model/engines/projection_engine.py; then
            echo "No production patch needed"
            exit 0
          fi
          git config user.name "EdgeIQ Historical Baseline CI"
          git config user.email "actions@users.noreply.github.com"
          git add fantasy_draft_model/engines/projection_engine.py
          git commit -m "feat: apply bounded historical regression to veteran baseline"
          git push origin HEAD:audit-and-sortable-board

  verify-demand-scarcity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt openpyxl
      - name: Verify targeted demand adjustment
        run: python -m pytest tests/test_league_demand_scarcity_adjustment.py -q
      - name: Verify adjacent ranking contracts
        run: >-
          python -m pytest
          tests/test_position_demand_scarcity_audit.py
          tests/test_pressure_meter_nan_safety.py
          tests/test_numeric_tier_scarcity.py
          tests/test_tier_signal_consistency.py
          tests/test_live_available_scoring_order.py
          tests/test_advanced_assistant_pipeline.py
          tests/test_qb_1qb_economics.py
          -q
      - name: Verify full suite after sortable test updates
        run: python -m pytest -q
